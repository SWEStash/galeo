name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes: `npm run check` covers them before the commit.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  # Fedora for the .rpm checks (ADR-036), pinned by digest: one index for x64 and arm64.
  FEDORA_IMAGE: fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c

jobs:
  linux:
    name: Linux (full)
    # Dependabot's updates are applied by hand on main, where CI runs; its pull requests never merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Audit dependencies (fails on high severity)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm run check:exports
      - run: npm run check:docs
      - run: npm run check:portable
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      # Ubuntu 24.04 restricts unprivileged user namespaces; allow them for the Electron binary
      # so it runs sandboxed, as the .deb does. Never --no-sandbox.
      - name: Allow the Chromium sandbox
        run: sudo scripts/dev-sandbox-setup.sh
      - name: End-to-end tests
        run: npm run headless -- npm run test:e2e
      # Socket-level zero-network proof (SR-07): every connect() of the app's process tree is
      # recorded; the suite also shows it goes red with the network lockdown switched off.
      - name: Install strace
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
      - name: No-network harness
        run: npm run headless -- npm run test:no-network
      # Startup timings from a build with perf marks; reported, and failing only on a
      # catastrophic regression until the release check enforces the PRD budgets.
      - name: Performance smoke
        run: GALEO_PERF=1 npm run build && npm run headless -- npm run test:perf
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results-linux
          path: tests/perf/results/
          if-no-files-found: ignore
          retention-days: 30
      # Packages build, the fuses read back from the binary as configured (SR-08), and the
      # packaged app starts through the launcher wrapper (ADR-009).
      - name: Install rpm, to build and check the .rpm
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package
        run: npm run package -- --linux deb rpm AppImage
      - name: Verify the package
        run: GALEO_VERIFY_RPM=1 npm run headless -- npm run verify:package
      # Fedora allows the user namespaces Chromium's sandbox needs; Docker's default seccomp profile doesn't.
      - name: The .rpm installs, upgrades and starts sandboxed on Fedora
        run: |
          version=$(node -p "require('./package.json').version")
          docker run --rm --security-opt seccomp=unconfined -v "$PWD/release:/rel:ro" -v "$PWD/scripts:/s:ro" \
            "$FEDORA_IMAGE" bash /s/rpm-install-check.sh "/rel/galeo-$version.x86_64.rpm"
      - name: The dnf repository script's tests, on Fedora as root
        run: |
          # Vite writes its temporary files here; the checkout itself stays read-only to the container's root.
          mkdir -p node_modules/.vite-temp node_modules/.vite
          docker run --rm -e GALEO_REQUIRE_DNF_TESTS=1 -v "$PWD:/src:ro" \
            --tmpfs /src/node_modules/.vite-temp --tmpfs /src/node_modules/.vite -w /src "$FEDORA_IMAGE" \
            sh -c 'dnf install -y -q nodejs rpm-build rpm-sign createrepo_c > /dev/null && npx vitest run scripts/dnf-repo.test.mjs'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7
