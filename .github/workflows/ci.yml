name: CI

# Throwaway diagnosis (never merged): the first Electron start on a fresh runner, 44.9.2 vs 45.0.0.
on:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  first-start:
    name: first start (electron ${{ matrix.electron }}, sample ${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        electron: ['44.9.2', '45.0.0']
        sample: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use electron ${{ matrix.electron }}
        run: npm install --no-save --ignore-scripts electron@${{ matrix.electron }}
      - run: npm run setup
      - run: node -p "require('electron/package.json').version"
      - run: npm run build
      - name: Allow the Chromium sandbox
        run: sudo scripts/dev-sandbox-setup.sh
      - name: First test, cold
        env:
          DEBUG: pw:browser*,pw:api
          ELECTRON_ENABLE_LOGGING: '1'
        run: npm run headless -- npx playwright test tests/e2e/accessibility.spec.ts:29 --project=e2e --workers=1 --reporter=list --trace=on || true
      - name: First test, warm
        env:
          DEBUG: pw:browser*,pw:api
          ELECTRON_ENABLE_LOGGING: '1'
        run: npm run headless -- npx playwright test tests/e2e/accessibility.spec.ts:29 --project=e2e --workers=1 --reporter=list || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-start-${{ matrix.electron }}-${{ matrix.sample }}
          path: test-results/
