name: Pages

# Publishes site/ as the project's website (https://swestash.github.io/galeo/), under /apt/ the signed apt
# repository holding the latest release's .deb files, one per architecture (ADR-029, ADR-035), and under /rpm/ the
# signed dnf repository holding its .rpm files (ADR-036). Nothing is built: the packages come from the release,
# checked against its checksums and attestations before their repositories are signed.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/apt-repo.sh'
      - 'scripts/dnf-repo.sh'
      - 'packaging/linux/galeo-archive-keyring.asc'
      - 'packaging/linux/galeo.repo'
  # Publishing a draft by hand fires this; drafts never do. A release published by a token would not: then run
  # this workflow by hand (RELEASING). The release event runs on the tag, which the github-pages environment
  # refuses (main only), so it only starts a run on main (hand-over below).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fedora for the dnf check (ADR-036), pinned by digest: one index for x64 and arm64.
  FEDORA_IMAGE: fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hand-over:
    name: Start the deploy on main
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  assemble:
    name: Check the release and build the repository
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No secrets here: this job downloads and checks the .deb, and writes the repository unsigned.
    permissions:
      contents: read
      attestations: read
    outputs:
      apt: ${{ steps.build.outputs.apt }}
      rpm: ${{ steps.build.outputs.rpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and check the latest release's .deb and .rpm files
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "No published release: the site only."
            exit 0
          fi
          # One per architecture (ADR-035); releases before 0.8.0 carry amd64 only.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern 'galeo_*.deb' --pattern 'galeo-*.rpm' --pattern SHA256SUMS
          debs=$(find "$dir" -name 'galeo_*.deb' | sort)
          printf '%s\n' "$debs" | grep -q '_amd64\.deb$' || { echo "no amd64 .deb, got: $debs"; exit 1; }
          [ "$(printf '%s\n' "$debs" | wc -l)" -le 2 ] || { echo "expected at most two .deb files, got: $debs"; exit 1; }
          # Releases before 0.9.0 carry no .rpm (ADR-036).
          rpms=$(find "$dir" -name 'galeo-*.rpm' | sort)
          [ -z "$rpms" ] || [ "$(printf '%s\n' "$rpms" | wc -l)" -le 2 ] || { echo "expected at most two .rpm files, got: $rpms"; exit 1; }
          (cd "$dir" && sha256sum --ignore-missing --strict -c SHA256SUMS)
          # Built by the release workflow, from this release's own tag, on GitHub's runners.
          for package in $debs $rpms; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$tag" --deny-self-hosted-runners
          done
          echo "debs=$(printf '%s ' $debs)" >> "$GITHUB_OUTPUT"
          echo "rpms=$(printf '%s ' $rpms)" >> "$GITHUB_OUTPUT"
      - name: Install rpm and createrepo_c, for the dnf repository
        if: steps.release.outputs.rpms != ''
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c
      - name: Build the unsigned repositories
        id: build
        env:
          DEBS: ${{ steps.release.outputs.debs }}
          RPMS: ${{ steps.release.outputs.rpms }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R site/. "$RUNNER_TEMP/pages/"
          # Only .deb files that ship the key can be installed from the repository (ADR-029).
          keyed=true
          for deb in $DEBS; do scripts/apt-repo.sh has-key "$deb" || keyed=false; done
          if [ -n "$DEBS" ] && [ "$keyed" = true ]; then
            # shellcheck disable=SC2086
            scripts/apt-repo.sh build "$RUNNER_TEMP/pages/apt" $DEBS
            cp packaging/linux/galeo-archive-keyring.asc "$RUNNER_TEMP/pages/apt/galeo.asc"
            echo "apt=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .deb with the repository key: no apt repository."
            echo "apt=false" >> "$GITHUB_OUTPUT"
          fi
          keyed=true
          for package in $RPMS; do scripts/dnf-repo.sh has-key "$package" || keyed=false; done
          if [ -n "$RPMS" ] && [ "$keyed" = true ]; then
            # shellcheck disable=SC2086
            scripts/dnf-repo.sh build "$RUNNER_TEMP/pages/rpm" $RPMS
            cp packaging/linux/galeo-archive-keyring.asc "$RUNNER_TEMP/pages/rpm/galeo.asc"
            cp packaging/linux/galeo.repo "$RUNNER_TEMP/pages/rpm/galeo.repo"
            echo "rpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .rpm with the repository key: no dnf repository."
            echo "rpm=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-unsigned
          path: ${{ runner.temp }}/pages
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign the repository
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can read the signing subkey: the github-pages environment, which only main deploys.
    # It runs no npm packages and no Actions beyond GitHub's own, pinned; the key is in one step, which deletes
    # the keyring when it is done.
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-unsigned
          path: ${{ runner.temp }}/pages
      - name: Sign Release
        if: needs.assemble.outputs.apt == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          # Set only while the standby subkey, which keeps its passphrase, signs a key rotation (RELEASING).
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          if [ -n "$APT_SIGNING_PASSPHRASE" ]; then
            printf '%s' "$APT_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          scripts/apt-repo.sh sign "$RUNNER_TEMP/pages/apt"
      - name: Check that apt accepts it
        if: needs.assemble.outputs.apt == 'true'
        run: scripts/apt-repo.sh check "$RUNNER_TEMP/pages/apt" packaging/linux/galeo-archive-keyring.asc
      # Its own keyring: gpg signs with its default key, so the apt and dnf subkeys never share one.
      - name: Sign repomd.xml
        if: needs.assemble.outputs.rpm == 'true'
        env:
          DNF_SIGNING_KEY: ${{ secrets.DNF_SIGNING_KEY }}
          # Set only while the standby subkey, which keeps its passphrase, signs a key rotation (RELEASING).
          DNF_SIGNING_PASSPHRASE: ${{ secrets.DNF_SIGNING_PASSPHRASE }}
        run: |
          test -n "$DNF_SIGNING_KEY" || { echo 'DNF_SIGNING_KEY is not set in the github-pages environment (RELEASING)' >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg-dnf"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "${GNUPGHOME:?}"' EXIT
          if [ -n "$DNF_SIGNING_PASSPHRASE" ]; then
            printf '%s' "$DNF_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          fi
          printf '%s\n' "$DNF_SIGNING_KEY" | gpg --batch --import
          scripts/dnf-repo.sh sign "$RUNNER_TEMP/pages/rpm"
      # Fedora allows the user namespaces Chromium's sandbox needs; dnf installs galeo's dependencies from Fedora.
      - name: Check that dnf installs from it (x64)
        if: needs.assemble.outputs.rpm == 'true'
        run: |
          docker run --rm -v "$RUNNER_TEMP/pages/rpm:/repo:ro" -v "$PWD/scripts:/s:ro" \
            -v "$PWD/packaging/linux/galeo-archive-keyring.asc:/galeo.asc:ro" "$FEDORA_IMAGE" \
            sh /s/dnf-repo.sh check /repo /galeo.asc
      - name: Hand the signed dnf repository to the arm64 check
        if: needs.assemble.outputs.rpm == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-signed
          path: ${{ runner.temp }}/pages/rpm
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

  # The same dnf check on an arm64 runner, against the repository the sign job signed.
  check-rpm-arm64:
    name: Check that dnf installs from it (arm64)
    needs: [assemble, sign]
    if: needs.assemble.outputs.rpm == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-signed
          path: ${{ runner.temp }}/rpm
      - run: |
          docker run --rm -v "$RUNNER_TEMP/rpm:/repo:ro" -v "$PWD/scripts:/s:ro" \
            -v "$PWD/packaging/linux/galeo-archive-keyring.asc:/galeo.asc:ro" "$FEDORA_IMAGE" \
            sh /s/dnf-repo.sh check /repo /galeo.asc

  deploy:
    name: Deploy
    needs: [sign, check-rpm-arm64]
    # A release without .rpm files skips the arm64 check, and still deploys.
    if: always() && needs.sign.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.check-rpm-arm64.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only this job may publish, and only through GitHub's Pages environment.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
