name: Feature request
description: Something galeo should do
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How galeo could solve it. Optional.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, alternatives, what's out of scope. Optional.
