name: Task
description: Maintenance, checks or chores (maintainer)
type: Task
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What's involved and why it matters, in one to three lines.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to do. For work only the maintainer can do, a runbook — what is needed, where it lives, what to run, what to look for, what to send back.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
    validations:
      required: true
